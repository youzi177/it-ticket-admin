services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-dev-only}
      MYSQL_DATABASE: it_ticket_admin
      MYSQL_USER: it_ticket
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-only}
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
